<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowdeck</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header Section -->
  <header class="header">
    <img src="icons/flowdeck-icon.png" alt="Flowdeck Logo" class="logo">
    <h1 class="app-name">Flowdeck</h1>
  </header>

  <!-- Course Section -->
  <section class="course-section">
    <div class="course-info">
      <p class="detected-course">Detected Course: <span id="detectedCourse">COMP XXXX</span></p>
    </div>
  </section>

  <!-- Grade Weights Section (Categories & Items) -->
  <section class="weights-section">
    <button class="section-title-toggle" id="weightsToggle" aria-expanded="true" aria-controls="weightsContent">
      <span class="chevron">▶</span>
      <h2 class="section-title">Grade Weights</h2>
    </button>
    <div class="weights-content" id="weightsContent">
      <div id="categoriesContainer" class="categories-container">
        <!-- Categories and expandable items rendered by popup.js from course data -->
      </div>
      <div class="button-group">
        <button id="saveWeightsBtn" class="btn btn-primary">Save Weights</button>
      </div>
      <div class="save-status" id="saveStatus" style="display: none;"></div>
    </div>
  </section>

  <!-- Results Section -->
  <section class="results-section">
    <h2 class="section-title">Results</h2>
    <div class="results-container">
      <div class="result-item">
        <span class="result-label">Current Grade:</span>
        <span id="currentGradeValue" class="result-value">--%</span>
      </div>
      <div class="result-item result-item-highlight">
        <span class="result-label result-label-small">If Perfect on Completed:</span>
        <span id="maxPossibleValue" class="result-value result-value-small">--%</span>
      </div>
      <div class="result-item">
        <label for="targetGrade" class="result-label">Target Grade:</label>
        <input type="text" id="targetGrade" class="target-input" placeholder="Enter target %">
      </div>
      <div class="result-item">
        <span class="result-label">Required Grade on Remaining Work:</span>
        <span id="requiredGradeValue" class="result-value">--%</span>
      </div>
    </div>
  </section>


    <div class="feedback-button-container">
      <button
              id="feedbackBtn"
              class="feedback-button"
      >

        Give Us Feedback
      </button>
    </div>


    <div id="feedbackForm" style="display:none; margin-top: 15px;">
      <iframe
              id="JotFormIFrame-250936223826055"
              title="Form"
              onload="window.parent.scrollTo(0,0)"
              allowtransparency="true"
              allow="geolocation; microphone; camera; fullscreen; payment"
              src="https://form.jotform.com/250936223826055"
              frameborder="0"
              style="min-width:100%;max-width:100%;height:1039px;border:none;"
              scrolling="no"
      ></iframe>

      <script src="https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js"></script>
      <script>
        window.jotformEmbedHandler(
                "iframe[id='JotFormIFrame-250936223826055']",
                "https://form.jotform.com/"
        );
      </script>
    </div>



  <script type="module" src="popup.js"></script>
</body>
</html>
